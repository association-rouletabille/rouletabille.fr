name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Holds the eleventy-img renditions and eleventy-fetch responses. Without
      # it every run re-encodes every image in avif, webp and jpeg.
      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: eleventy-${{ runner.os }}-${{ hashFiles('package-lock.json', 'src/imgs/**') }}
          restore-keys: |
            eleventy-${{ runner.os }}-

      - run: npm ci

      - run: npm run lint:ci

      - run: npm run format:check

      - run: npm test

      - run: npm run build:dist

      # llms-full.txt is regenerated by the build; a diff here means the commit
      # changed page content without committing the refreshed artifact.
      - name: Check llms-full.txt is up to date
        run: |
          if ! git diff --quiet -- src/public/llms-full.txt; then
            echo "::error file=src/public/llms-full.txt::src/public/llms-full.txt is out of date. Page content changed but the regenerated artifact was not committed. Run 'npm run build:dev', then commit src/public/llms-full.txt."
            git diff -- src/public/llms-full.txt
            exit 1
          fi
