<?xml version="1.0" encoding="UTF-8"?>
<svg
  version="1.1"
  viewBox="0 0 1000 1127.1101"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:svg="http://www.w3.org/2000/svg">
  <!--
    Four `.uni-part` groups, because the game at /unirunner throws them apart
    when it crashes and each one has to move on its own. The pedals ride the
    crankset as one rigid assembly, which is how they behave anyway.
  -->
  <g class="unicycle-body">
    <g class="uni-part" data-part="cranks" stroke="currentColor">
      <g class="unicycle-cranks">
        <path
          stroke-width="40"
          stroke-linecap="butt"
          d="M 518.60798,758.84437 C 370.1846,695.41768 264.21923,642.64848 264.21923,642.64848"
        />
        <g class="unicycle-pedal">
          <path
            stroke-width="35"
            stroke-linecap="round"
            d="M 331.68416,598.44352 209.91028,678.01245"
          />
        </g>
        <g class="unicycle-pedal">
          <path
            stroke-width="35"
            stroke-linecap="round"
            d="M 591.86191,718.4284 455.87929,788.84059"
          />
        </g>
      </g>
    </g>
    <g class="uni-part" data-part="fork" stroke="currentColor">
      <path
        stroke-width="55.9"
        stroke-linecap="round"
        d="M 706.01632,208.3948 C 587.90491,525.13074 396.58162,727.48729 396.58162,727.48729"
      />
    </g>
    <g
      class="uni-part"
      data-part="seat">
      <path
        fill="currentColor"
        d="m 534.654205,161.886867 c -17.197256,-22.772445 -9.462871,-61.242377 11.474186,-78.578108 18.32947,-18.331417 44.416713,-31.05419 71.636049,-26.1004 35.708995,10.981832 58.019852,67.489062 82.877069,74.978772 23.01999,9.999916 69.741337,40.194545 69.741337,40.194545 0,0 229.332188,-1.182256 165.817038,99.590365 -43.307171,28.781696 -140.049866,12.568043 -205.464446,-1.925863 -75.168879,-15.438447 -141.521698,-54.943089 -196.081234,-108.15931 z"
      />
    </g>
    <g
      class="uni-part"
      data-part="wheel">
      <path
        fill="none"
        stroke="currentColor"
        stroke-width="60.000076"
        stroke-linecap="butt"
        d="m 625.054687,491.006385 c 3.184672,2.318886 6.722617,6.676398 9.989775,10.323362 35.897615,40.070488 84.571458,113.335418 84.571458,216.053658 0,175.778807 -142.862415,318.275688 -319.092109,318.275688 -176.229701,0 -319.092109,-142.496881 -319.092121,-318.275688 0,-175.778826 142.862411,-318.275707 319.092121,-318.275707 58.660971,0 106.103753,15.903813 138.507054,31.473422 4.807443,2.309929 5.551529,2.900927 9.802191,5.204108"
      />
    </g>
  </g>
</svg>
